name: E2E Staging

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v5
        with:
          node-version: 20.x
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Smoke E2E (send → timeline → list → SSE)
        run: node scripts/smoke-e2e.mjs
        env:
          FLUXOMAIL_BASE_URL: ${{ secrets.FLUXOMAIL_BASE_URL }}
          FLUXOMAIL_API_KEY: ${{ secrets.FLUXOMAIL_API_KEY }}
          FLUXOMAIL_TOKEN_CMD: ${{ secrets.FLUXOMAIL_TOKEN_CMD }}
